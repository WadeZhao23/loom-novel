[project]
name = "loom-novel"
version = "0.4.3"
description = "把一队分工 Agent 织成一条写小说流水线的命令行工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chambers" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    # 上限 <3 是必须的,不是保守:openai 3.0.0 把传输层从 httpx 换成了 httpx2,
    # 而 backends.py 用 httpx.Timeout 配显式超时。不钉上限时全新安装会拉到 3.x,
    # `import httpx` 直接 ModuleNotFoundError,且被 except 包成「缺少 openai 这个依赖包」
    # 这种误导性报错(openai 明明装着)。2026-08-12 CI 双平台实测撞上。
    # 要升 openai 3 得先把 httpx→httpx2 迁移做完并真机验证,那是独立任务。
    "openai>=1.30,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dist = ["pyinstaller>=6.0"]   # 打包成 .app/.exe:pip install -e ".[dist]"
dev = ["pytest>=8.0", "pyyaml>=6.0"]   # 跑测试:pip install -e ".[dev]" && pytest

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
loom-app = "loom.desktop:run"      # 桌面客户端(原生窗口)
loom-serve = "loom.desktop:serve"  # 兜底:浏览器里跑
loom = "loom.cli:app"              # 内部引擎调试 CLI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.hatch.build.targets.wheel.force-include]
"loom/templates" = "loom/templates"
"loom/webui" = "loom/webui"
"loom/sample" = "loom/sample"
